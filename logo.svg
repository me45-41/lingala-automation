<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec gradient RDC -->
  <defs>
    <linearGradient id="gradientRDC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055A6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0087BD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientLA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CE1126;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond arrondi -->
  <rect width="256" height="256" rx="40" fill="url(#gradientRDC)" />
  
  <!-- Symbole de code stylisé -->
  <text x="128" y="80" font-family="monospace" font-size="60" font-weight="bold" fill="#FCD116" text-anchor="middle">{</text>
  <text x="128" y="140" font-family="monospace" font-size="60" font-weight="bold" fill="#FCD116" text-anchor="middle">}</text>
  
  <!-- Typographie LA -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#gradientLA)" text-anchor="middle">LA</text>
  
  <!-- Flèche de compilation -->
  <text x="128" y="230" font-family="monospace" font-size="30" fill="#CE1126" text-anchor="middle">→</text>
</svg>
